name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - if: matrix.target == 'linux-x86_64'
        run: |
          rustfmt --edition 2024 --check benchmarks/generate_fixture.rs
          rustc -D warnings benchmarks/generate_fixture.rs -o "$RUNNER_TEMP/rsomics-methyl-fixture"
      - if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check
      - if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.target == 'linux-x86_64'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - if: matrix.target == 'linux-x86_64'
        run: cargo package --locked
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --release --locked --all-targets --all-features
